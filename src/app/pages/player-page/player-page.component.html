<div>
    <mat-form-field>
        <select matNativeControl [formControl]="selectedYear" required>
            @for (option of yearList; track option) {
                <option [value]="option" requireSelection>{{option}}</option>
              }
        </select>
    </mat-form-field>
    <app-shot-chart [playerId]="playerId" [year]="selectedYear.value"></app-shot-chart>
</div>
